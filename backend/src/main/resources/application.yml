server:
  port: ${SERVER_PORT:9003}

spring:
  application:
    name: linshu-ops
  
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:linshu_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  
  # 邮件配置
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.ssl.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    db-config:
      id-type: auto

# 监控配置
monitor:
  schedule:
    fixed-rate: ${MONITOR_INTERVAL:30000}

# 告警配置
alert:
  schedule:
    fixed-rate: ${ALERT_INTERVAL:120000}
  recheck:
    lookback-minutes: ${ALERT_LOOKBACK:20}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME}}
    cooldown-minutes: ${MAIL_COOLDOWN:30}

# 千帆AI配置
qianfan:
  v2:
    base-url: ${QIANFAN_BASE_URL:https://qianfan.baidubce.com/v2}
    token: ${QIANFAN_TOKEN}
    audit-model-name: ${QIANFAN_MODEL:glm-5}
    chat-model-name: ${QIANFAN_MODEL:glm-5}
    read-timeout-seconds: ${QIANFAN_TIMEOUT:120}
    agent-read-timeout-seconds: ${QIANFAN_AGENT_TIMEOUT:30}

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  cookie-name: ${JWT_COOKIE_NAME:linshu_token}

# 加密配置
encryption:
  key: ${ENCRYPTION_KEY}
  algorithm: AES/CBC/PKCS5Padding
  iv-length: 16

# 日志配置
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.example.backend: ${APP_LOG_LEVEL:DEBUG}
  file:
    name: ${LOG_FILE:logs/linshu-ops.log}
